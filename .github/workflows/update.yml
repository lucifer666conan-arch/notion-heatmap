
name: Update Notion Heatmap


on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:


permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install browser and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium

      - name: Generate heatmap
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python update_heatmap.py

      - name: Archive historical heatmaps
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ARCHIVE_DATABASE_ID: ${{ secrets.NOTION_ARCHIVE_DATABASE_ID }}
        run: python archive_heatmap.py

      - name: Commit updated heatmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update heatmap"
          git push
